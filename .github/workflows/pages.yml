name: Deploy PILARK to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Restore the original website from ZIP
        run: |
          if [ -f "PILARK-assets-pack.zip" ]; then
            unzip -oq "PILARK-assets-pack.zip" -d .
          fi
          mkdir -p assets/profile assets/catalog
          if [ -d "profile" ]; then
            cp -R profile/. assets/profile/
          fi
          if [ -d "catalog" ]; then
            cp -R catalog/. assets/catalog/
          fi
          find . -type f \( -name 'PILAR Catalog 2026-web.pdf' -o -name 'PILAR Company Profile 2026.pdf' \) -not -path './assets/*' -exec cp -f {} assets/ \;
      - name: Verify required assets
        run: |
          test -f assets/profile/page01.jpg
          test -f assets/profile/page04.jpg
          test -f assets/catalog/page14.jpg
          test -f assets/catalog/page49.jpg
      - name: Apply ONLY the benefit-grid fix
        run: cat benefit-fix.css >> styles.css
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

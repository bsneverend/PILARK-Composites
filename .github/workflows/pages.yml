name: Deploy PILARK to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Extract website assets from ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -type f -name 'PILARK-assets-pack.zip' -print -quit)
          test -n "$ZIP"
          rm -rf /tmp/pilark-pack
          mkdir -p /tmp/pilark-pack assets/profile assets/catalog
          unzip -oq "$ZIP" -d /tmp/pilark-pack
          PROFILE=$(find /tmp/pilark-pack -type d -name profile -print -quit || true)
          CATALOG=$(find /tmp/pilark-pack -type d -name catalog -print -quit || true)
          test -n "$PROFILE"
          test -n "$CATALOG"
          cp -R "$PROFILE"/. assets/profile/
          cp -R "$CATALOG"/. assets/catalog/
          find /tmp/pilark-pack -type f \( -name 'PILAR Catalog 2026-web.pdf' -o -name 'PILAR Company Profile 2026.pdf' \) -exec cp -f {} assets/ \;
          echo "Profile images: $(find assets/profile -type f | wc -l)"
          echo "Catalog images: $(find assets/catalog -type f | wc -l)"
      - name: Verify required assets
        run: |
          test -f assets/profile/page01.jpg
          test -f assets/profile/page04.jpg
          test -f assets/catalog/page14.jpg
          test -f assets/catalog/page49.jpg
      - name: Apply ONLY the benefit-grid fix
        run: cat benefit-fix.css >> styles.css
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

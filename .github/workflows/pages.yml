name: Deploy PILARK to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify uploaded assets
        run: |
          set -e
          test -f assets/profile/page01.jpg
          test -f assets/profile/page04.jpg
          test -f assets/catalog/page14.jpg
          test -f assets/catalog/page49.jpg
          echo "Profile images: $(find assets/profile -type f | wc -l)"
          echo "Catalog images: $(find assets/catalog -type f | wc -l)"
      - name: Apply ONLY the benefit-grid fix
        run: cat benefit-fix.css >> styles.css
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
